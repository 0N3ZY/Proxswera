name: Deploy Cloudflare Worker

# Production deployments are deliberately manual. A successful CI run must
# never change the live edge Worker without an explicit human action.
on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "I approve deploying this exact branch to the production Cloudflare Worker."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Scramjet edge proxy
    if: ${{ inputs.confirm_production_deploy == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Verify deployment credential is configured
        env:
          CF_WORKERS_API_TOKEN: ${{ secrets.CF_WORKERS_API_TOKEN }}
        run: |
          if [[ -z "$CF_WORKERS_API_TOKEN" ]]; then
            echo "::error::Cloudflare Worker deployment skipped. Configure CF_WORKERS_API_TOKEN with Workers Scripts Write permission."
            exit 1
          fi

      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
