name: Render Runtime Smoke Test

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "devserver.ts"
      - "packages/demo/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/render-runtime-check.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate maintenance scripts
        run: |
          node --check .github/scripts/ai-repair.mjs
          node --check .github/scripts/ai-team.mjs
          node --check .github/scripts/verify-ai-patch.mjs

      - name: Build production image
        run: docker build --progress=plain -t scramjetfork-smoke .

      - name: Start production container
        run: |
          docker run -d --name scramjetfork-smoke             -e NODE_ENV=production             -e PORT=10000             -p 10000:10000             scramjetfork-smoke

      - name: Check HTTP and health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:10000/healthz
          node scripts/smoke-runtime.mjs

      - name: Print container logs on failure
        if: failure()
        run: docker logs scramjetfork-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f scramjetfork-smoke || true
