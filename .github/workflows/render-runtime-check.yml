name: Render Runtime Smoke Test

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "worker/**"
      - "config/**"
      - "platforms/**"
      - "wrangler.jsonc"
      - "devserver.ts"
      - "packages/demo/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/**"
      - "tests/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-runtime-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate maintenance scripts
        run: |
          node --check .github/scripts/ai-repair.mjs
          node --check .github/scripts/ai-team.mjs
          node --check .github/scripts/discover-reuse.mjs
          node --check .github/scripts/verify-ai-patch.mjs
          node --check scripts/smoke-runtime.mjs
          node --check worker/worker.js
          node --test tests/ci/workerProxy.test.mjs tests/ci/platformDiscovery.test.mjs tests/ci/cloudRunWorkflow.test.mjs tests/ci/buildConfig.test.mjs tests/ci/maintenanceWorkflow.test.mjs tests/ci/releaseWorkflow.test.mjs tests/ci/settingsNormalizers.test.mjs
          node --check tests/ci/packageValidation.js

      - name: Build production image
        run: docker build --progress=plain -t scramjetfork-smoke .

      - name: Start production container
        run: |
          docker run -d --name scramjetfork-smoke             -e NODE_ENV=production             -e PORT=10000             -p 10000:10000             scramjetfork-smoke

      - name: Check HTTP and health endpoint
        run: |
          for attempt in $(seq 1 30); do
            : "$attempt"
            if curl --fail --silent http://127.0.0.1:10000/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:10000/healthz
          docker exec --user root scramjetfork-smoke ln -s /etc/passwd /app/packages/demo/dist/__outside.txt
          docker cp scripts/smoke-runtime.mjs scramjetfork-smoke:/tmp/smoke-runtime.mjs
          docker exec --user node scramjetfork-smoke node /tmp/smoke-runtime.mjs

      - name: Print container logs on failure
        if: failure()
        run: docker logs scramjetfork-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f scramjetfork-smoke || true
