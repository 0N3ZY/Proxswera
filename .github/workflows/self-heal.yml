name: AI Self-Healing Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  diagnose-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Build Check
        id: test_build
        continue-on-error: true
        run: |
          corepack enable && corepack prepare pnpm@9.0.0 --activate
          
          # Install root dependencies including AI SDKs safely
          npm install --legacy-peer-deps
          
          pnpm dev || pnpm build || exit 1

      - name: Commit and Push AI Patches
        if: steps.test_build.outcome == 'failure'
        run: |
          git config --global user.name "Scramjet-AI-Agent"
          git config --global user.email "ai-agent@system.local"
          git add .
          git commit -m "🤖 AI Auto-Patch: Resolved build/runtime errors" || echo "No changes to commit"
          git push
