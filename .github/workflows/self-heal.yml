name: AI Self-Healing Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scramjet-ai-maintenance
  cancel-in-progress: false

jobs:
  build-and-repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build production image
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          docker build --progress=plain -t scramjetfork-ci . 2>&1 | tee build.log

      - name: Check live Render health
        id: health
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SITE_URL: https://scramjetfork.onrender.com
        run: |
          if ! curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-connrefused --max-time 15 \
            --dump-header health.headers --output health.body --write-out 'HTTP %{http_code}\n' \
            "$SITE_URL/healthz" > health.status; then
            {
              printf '\n--- Render health diagnostic ---\n'
              printf 'Health endpoint: %s/healthz\n' "$SITE_URL"
              cat health.status health.headers health.body 2>/dev/null || true
            } >> build.log
            exit 1
          fi

      - name: Ask AI for a minimal repair
        id: ai
        if: steps.build.outcome == 'failure' || steps.health.outcome == 'failure'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          OR_API_KEY: ${{ secrets.OR_API_KEY || secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
          CF_API_KEY: ${{ secrets.CF_API_KEY || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODEL: "@cf/zai-org/glm-4.7-flash"
        run: |
          node .github/scripts/ai-team.mjs build.log > repair.patch

      - name: Apply and verify AI patch
        id: verify
        if: (steps.build.outcome == 'failure' || steps.health.outcome == 'failure') && steps.ai.outcome == 'success'
        run: |
          set -euo pipefail
          git apply --check repair.patch
          git apply repair.patch
          git add -N -- .
          git diff --check
          node .github/scripts/verify-ai-patch.mjs

      - name: Build repaired production image
        id: repaired_build
        if: steps.verify.outcome == 'success'
        run: |
          set -o pipefail
          docker build --progress=plain -t scramjetfork-repaired . 2>&1 | tee repaired-build.log

      - name: Smoke-test repaired production image
        id: smoke
        if: steps.repaired_build.outcome == 'success'
        run: |
          set -euo pipefail
          docker run -d --name scramjetfork-repaired -e NODE_ENV=production -e PORT=10000 -p 10000:10000 scramjetfork-repaired
          cleanup() { docker rm -f scramjetfork-repaired >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            : "$attempt"
            if curl --fail --silent http://127.0.0.1:10000/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:10000/healthz
          docker exec --user root scramjetfork-repaired ln -s /etc/passwd /app/packages/demo/dist/__outside.txt
          docker cp scripts/smoke-runtime.mjs scramjetfork-repaired:/tmp/smoke-runtime.mjs
          docker exec --user node scramjetfork-repaired node /tmp/smoke-runtime.mjs

      - name: Create repair pull request
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "AI patch produced no repository changes."
            exit 1
          fi

          BRANCH="ai-repair/${GITHUB_RUN_ID}"
          git config user.name "scramjet-ai-maintenance"
          git config user.email "scramjet-ai-maintenance@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "AI repair: resolve verified production build failure"
          gh auth setup-git
          git push origin "$BRANCH"

          gh pr create \
            --repo "$GH_REPO" \
            --head "$BRANCH" \
            --base main \
            --title "AI repair: verified build fix" \
            --body "The AI maintenance workflow proposed a repair after a failed production build or health check. The patch passed deterministic path, secret-leak, security-downgrade, whitespace, production Docker-build, and runtime smoke checks. Every AI-generated repair requires human review and explicit manual merging."

          echo "All AI repair pull requests require human review; no automatic merge is permitted."

      - name: Report AI repair unavailable
        if: (steps.build.outcome == 'failure' || steps.health.outcome == 'failure') && steps.ai.outcome == 'failure'
        run: |
          echo "::warning::The AI team could not produce a safe repair. Check that at least three distinct provider keys are configured as GitHub Actions repository secrets and review the provider diagnostics.";
