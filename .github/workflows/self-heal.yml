name: AI Self-Healing Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scramjet-ai-maintenance
  cancel-in-progress: false

jobs:
  build-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build production image
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          docker build --progress=plain -t scramjetfork-ci . 2>&1 | tee build.log

      - name: Check live Render health
        id: health
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SITE_URL: https://scramjetfork.onrender.com
        run: |
          if ! curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-connrefused --max-time 15 "$SITE_URL/healthz"; then
            printf 'Live Render health check failed for %s/healthz. The service may be returning 502/503 or failing to start.\n' "$SITE_URL" > build.log
            exit 1
          fi

      - name: Ask AI for a minimal repair
        id: ai
        if: steps.build.outcome == 'failure' || steps.health.outcome == 'failure'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          node .github/scripts/ai-repair.mjs build.log > repair.patch

      - name: Apply and verify AI patch
        id: verify
        if: (steps.build.outcome == 'failure' || steps.health.outcome == 'failure') && steps.ai.outcome == 'success'
        run: |
          git apply --check repair.patch
          git apply repair.patch
          git add -N -- .
          git diff --check
          node .github/scripts/verify-ai-patch.mjs
          docker build --progress=plain -t scramjetfork-repaired . 2>&1 | tee repaired-build.log

      - name: Create repair pull request
        id: pr
        if: (steps.build.outcome == 'failure' || steps.health.outcome == 'failure') && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "AI patch produced no repository changes."
            exit 1
          fi

          BRANCH="ai-repair/${GITHUB_RUN_ID}"
          git config user.name "scramjet-ai-maintenance"
          git config user.email "scramjet-ai-maintenance@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "AI repair: resolve verified production build failure"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$GH_REPO" \
            --head "$BRANCH" \
            --base main \
            --title "AI repair: verified build fix" \
            --body "The AI maintenance workflow proposed a repair after a failed production build or health check. The patch passed path, secret-leak, security-downgrade, whitespace, and full production Docker-build checks. Application and protected-area changes require human review; no security-sensitive code is auto-merged."

          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Ev '(^README\.md$|^docs/.*\.md$|\.md$|\.css$)' >/dev/null; then
            echo "Changes include application code; human approval is required."
          else
            echo "Documentation or CSS-only patch; enabling auto-merge after required checks."
            gh pr merge "$BRANCH" --repo "$GH_REPO" --auto --squash
          fi

      - name: Report missing AI secrets
        if: (steps.build.outcome == 'failure' || steps.health.outcome == 'failure') && steps.ai.outcome == 'failure'
        run: |
          echo "::warning::Build failed and AI repair could not run. Configure GROQ_API_KEY and/or GEMINI_API_KEY as GitHub Actions repository secrets."
