name: Upstream Scramjet Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scramjet-upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream Scramjet
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/MercuryWorkshop/scramjet.git
          git fetch --no-tags upstream main
          echo "sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Create an upstream update branch
        id: sync
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="upstream-sync/${UPSTREAM_SHA:0:12}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -c "$BRANCH"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-ff --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream changes conflict with the fork. No files were pushed; resolve the conflict manually."
            exit 1
          fi

          if git diff --quiet origin/main...HEAD; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh auth setup-git
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open upstream update pull request
        if: steps.sync.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          gh pr create \
            --repo "$GH_REPO" \
            --head "$BRANCH" \
            --base main \
            --title "Upstream sync: MercuryWorkshop/scramjet ${UPSTREAM_SHA:0:12}" \
            --body "Automated merge of MercuryWorkshop/scramjet main at $UPSTREAM_SHA.

          This PR is intentionally not auto-merged. CI, runtime checks, and the AI review/optimisation process must complete before a human approves it."
